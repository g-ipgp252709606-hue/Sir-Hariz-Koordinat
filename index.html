<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aplikasi Permainan Koordinat Matematik</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;transition:transform .15s,filter .15s}
button:hover{transform:translateY(-2px);filter:brightness(1.04)}

/* BAR PERTUKARAN PERMAINAN (STICKY ATAS) */
.top-game-switcher {
  background: #09203f;
  padding: 10px 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 99999;
  border-bottom: 2px solid #1e456e;
}
.top-game-switcher span {
  color: #fff;
  font-weight: 800;
  font-size: 14px;
}
.switcher-btn {
  background: #173b60;
  color: #d1e8ff;
  border: 2px solid #366493;
  padding: 8px 16px;
  border-radius: 20px;
  font-weight: 800;
  font-size: 13px;
  cursor: pointer;
}
.switcher-btn.active {
  background: #ffd166;
  color: #4a3000;
  border-color: #ffffff;
  box-shadow: 0 0 10px rgba(255, 209, 102, 0.6);
}

.game-wrapper { display: none; }
.game-wrapper.active { display: block; }

/* =========================================================
   STYLE PERMAINAN 1 (MISI PENYELAMAT DUNIA)
   ========================================================= */
#game1-root {
  --navy:#102746;--ink:#20334f;--cream:#fff9e9;--gold:#ffd166;--coral:#ff786b;
  --teal:#42d6c4;--purple:#8b72f8;--sky:#9be7ff;--green:#42c987;
  color:var(--ink);
  background:radial-gradient(circle at 10% 10%,#d8fbff 0,transparent 30%),linear-gradient(135deg,#f9edce,#d5f5e9 55%,#d9d4ff);
  min-height: calc(100vh - 54px);
  padding-bottom: 20px;
}
.g1-app{max-width:1120px;margin:auto;padding:18px}
.g1-topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}
.g1-brand{font-weight:950;letter-spacing:.4px;font-size:clamp(16px,3vw,22px);color:#17385a}
.g1-brand span{display:inline-grid;place-items:center;background:var(--gold);border-radius:12px;padding:7px;margin-right:7px}
.g1-top-actions{display:flex;gap:8px;flex-wrap:wrap}
.g1-pill{border:2px solid #ffffffaa;background:#ffffffb8;border-radius:999px;padding:9px 13px;font-weight:800;color:#28405f}
.g1-screen{display:none;animation:g1-enter .25s ease}
.g1-screen.active{display:block}
@keyframes g1-enter{from{opacity:.2;transform:translateY(7px)}to{opacity:1;transform:none}}
.g1-panel{background:#ffffffd9;border:2px solid #fff;border-radius:25px;padding:clamp(18px,3vw,30px);box-shadow:0 16px 35px #344d7020}
.g1-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center;min-height:490px;overflow:hidden;position:relative}
.g1-eyebrow{display:inline-block;background:#dcfff4;color:#16755e;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:900;letter-spacing:.7px}
.g1-hero h1{font-size:clamp(36px,6vw,67px);line-height:.98;letter-spacing:-2px;margin:17px 0 14px;color:#153b62}
.g1-hero h1 em{font-style:normal;color:#f06d56}
.g1-panel h2{margin:0 0 10px;font-size:clamp(25px,4vw,36px);color:#183b60}
.g1-lead{font-size:17px;line-height:1.65;color:#526780;max-width:560px}
.g1-btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:23px}
.g1-btn{border-radius:14px;padding:13px 18px;font-weight:900;box-shadow:0 5px 0 #172d4720}
.g1-btn.primary{background:var(--coral);color:white}
.g1-btn.secondary{background:#e7e1ff;color:#4d3aa5}
.g1-btn.gold{background:var(--gold);color:#68410c}
.g1-art{min-height:340px;display:grid;place-items:center;position:relative}
.g1-island{width:min(100%,400px);aspect-ratio:1;border-radius:48% 52% 45% 55%;background:linear-gradient(150deg,#b5f3c6 0 28%,#55cba5 29% 53%,#219e9c 54%);border:9px solid #fff;box-shadow:0 15px 0 #2b897b30;position:relative;transform:rotate(-5deg)}
