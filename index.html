
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misi Koordinat</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:18px;
 font-family:Arial,sans-serif;color:#19324d;
 background:linear-gradient(135deg,#b8f3ff,#e7d5ff,#fff1bd);
}
main{max-width:900px;margin:auto}
header{text-align:center}
h1{color:#6535bc;margin-bottom:6px}
.subtitle{color:#50627a}
.panel{
 background:white;border-radius:20px;padding:18px;
 margin:14px 0;box-shadow:0 5px 18px #35476520;
}
.stats{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap}
.stat{background:#f0eaff;border-radius:12px;padding:10px;font-weight:bold}
#question{text-align:center;font-size:18px;line-height:1.6}
#target{font-size:30px;color:#713de0;font-weight:bold}
.game{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.grid{
 display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
 border:2px solid #8295b8;
}
.cell{
 aspect-ratio:1;border:1px solid #d0d9e8;
 display:flex;align-items:center;justify-content:center;
 font-size:clamp(16px,4vw,27px);background:#fff;
}
.cell.target{background:#ffe680}
.cell.wall{background:#ffb4b4}
.cell.player{background:#b7f7d2}
.cell.done{background:#b8f1ff}
.labels{display:grid;grid-template-columns:repeat(6,1fr);text-align:center;margin-bottom:5px;font-weight:bold}
.rowlabels{display:grid;grid-template-rows:repeat(6,1fr);font-weight:bold}
.board{display:grid;grid-template-columns:20px 1fr;gap:5px}
.rowlabels span{display:flex;align-items:center;justify-content:center}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{
 border:0;border-radius:12px;padding:12px 8px;
 font-size:15px;font-weight:bold;cursor:pointer;
 background:#eae2ff;color:#5430a3;
}
button:hover{filter:brightness(.96);transform:translateY(-1px)}
.answer{border:2px solid #b8a1fa}
.primary{background:#673de6;color:white;width:100%;margin-top:12px}
.audio{background:#fff0bf;color:#755000}
#feedback{text-align:center;font-weight:bold;min-height:25px;margin-top:12px}
footer{text-align:center;font-size:13px;color:#52627a}
@media(max-width:600px){
 .game{grid-template-columns:1fr}
 .panel{padding:13px}
}
</style>
</head>
<body>
<main>
<header>
 <h1>🗺️ MISI KOORDINAT</h1>
 <div class="subtitle">Pengembaraan Matematik Tahun 4–6</div>
</header>

<section class="panel">
 <div class="stats">
  <div class="stat">⭐ Skor: <span id="score">0</span></div>
  <div class="stat">🚩 Tahap: <span id="level">1</span></div>
  <button class="audio" id="musicBtn">🎵 Muzik: OFF</button>
 </div>
</section>

<section class="panel">
 <div id="question">
  Bantu pengembara mencari bintang!<br>
  Pergi ke koordinat:
  <div id="target">(C, 3)</div>
 </div>

 <div class="game">
  <div>
   <div class="labels">
    <span>A</span><span>B</span><span>C</span>
    <span>D</span><span>E</span><span>F</span>
   </div>
   <div class="board">
    <div class="rowlabels">
     <span>1</span><span>2</span><span>3</span>
     <span>4</span><span>5</span><span>6</span>
    </div>
    <div class="grid" id="grid"></div>
   </div>
  </div>

  <div>
   <h3>Pilih koordinat yang betul:</h3>
   <div class="answers" id="answers"></div>
   <div id="feedback" aria-live="polite"></div>
   <button class="primary" id="nextBtn" hidden>
    Soalan seterusnya ➜
   </button>
  </div>
 </div>
</section>

<footer>
 Tip: Huruf menunjukkan kedudukan mendatar, nombor menunjukkan kedudukan menegak.
</footer>
</main>

<script>
const letters = ["A","B","C","D","E","F"];
let score = 0, level = 1, target, player, answered = false;
let audioCtx, musicTimer, musicOn = false, noteIndex = 0;

const $ = id => document.getElementById(id);
const grid = $("grid");

// Sound effects made with JavaScript: no audio files needed.
function tone(freq, duration=0.15, type="sine", volume=0.07) {
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.001, audioCtx.currentTime + duration
    );
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

// A simple original electronic melody.
function startMusic() {
  if (musicOn) return;
  musicOn = true;
  $("musicBtn").textContent = "🎵 Muzik: ON";
  const melody = [523,659,784,659,587,698,880,698];
  function playNote() {
    if (!musicOn) return;
    tone(melody[noteIndex % melody.length], 0.22, "triangle", 0.025);
    noteIndex++;
  }
  playNote();
  musicTimer = setInterval(playNote, 300);
}

function stopMusic() {
  musicOn = false;
  clearInterval(musicTimer);
  $("musicBtn").textContent = "🎵 Muzik: OFF";
}

$("musicBtn").addEventListener("click", () => {
  if (musicOn) stopMusic();
  else startMusic();
});

function randomCell() {
  return {
    x: Math.floor(Math.random()*6),
    y: Math.floor(Math.random()*6)
  };
}

function coord(p) {
  return `(${letters[p.x]}, ${p.y+1})`;
}

function same(a,b) {
  return a.x===b.x && a.y===b.y;
}

function newQuestion() {
  answered = false;
  $("feedback").textContent = "";
  $("nextBtn").hidden = true;
  player = {x:0,y:5};
  target = randomCell();

  while (same(target,player)) target = randomCell();

  $("target").textContent = coord(target);
  renderGrid();

  const choices = [target];
  while (choices.length < 4) {
    const p = randomCell();
    if (!choices.some(c=>same(c,p))) choices.push(p);
  }

  // Shuffle answer choices.
  choices.sort(()=>Math.random()-0.5);
  $("answers").replaceChildren();

  choices.forEach(p=>{
    const btn = document.createElement("button");
    btn.className = "answer";
    btn.textContent = coord(p);
    btn.addEventListener("click",()=>checkAnswer(p,btn));
    $("answers").appendChild(btn);
  });
}

function renderGrid() {
  grid.replaceChildren();

  for(let y=0;y<6;y++){
    for(let x=0;x<6;x++){
      const cell = document.createElement("div");
      cell.className = "cell";

      if (x===target.x && y===target.y) {
        cell.classList.add("target");
        cell.textContent = "⭐";
      }

      if (x===player.x && y===player.y) {
        cell.classList.add("player");
        cell.textContent = "🧑";
      }

      grid.appendChild(cell);
    }
  }
}

function checkAnswer(p,btn) {
  if(answered) return;
  answered = true;

  if(same(p,target)) {
    score += 10;
    level++;
    $("score").textContent = score;
    $("level").textContent = level;
    $("feedback").textContent = "🎉 Betul! Anda dapat 10 mata!";
    $("feedback").style.color = "#16834a";
    btn.style.background = "#b7f7d2";
    tone(660,0.12);
    setTimeout(()=>tone(880,0.2),120);
  } else {
    $("feedback").textContent =
      "😊 Belum tepat! Jawapan ialah " + coord(target);
    $("feedback").style.color = "#d14c4c";
    btn.style.background = "#ffd4d4";
    tone(220,0.3,"sawtooth",0.04);
  }

  $("nextBtn").hidden = false;
}

$("nextBtn").addEventListener("click",newQuestion);

newQuestion();
</script>
</body>
</html>
